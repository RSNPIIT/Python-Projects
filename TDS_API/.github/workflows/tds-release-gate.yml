name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

jobs:
  test-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: "TDS identity: 24f3004027@ds.study.iitm.ac.in"
        run: echo "Identity verified for 24f3004027@ds.study.iitm.ac.in"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn pydantic pytest requests

      - name: Test Policy Module
        run: |
          python -c "import TDS_API.main as m; print('Module verified successfully')"
