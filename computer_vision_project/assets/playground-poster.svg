<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Computer Vision Playground</title>
  <desc id="desc">Five colorful computer vision projects for webcam play.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10182d"/><stop offset="1" stop-color="#172c42"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56e0ce"/><stop offset="1" stop-color="#68a8ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="720" rx="36" fill="url(#bg)"/>
  <circle cx="1060" cy="120" r="170" fill="#56e0ce" opacity=".08"/><circle cx="60" cy="650" r="230" fill="#6f83ff" opacity=".08"/>
  <text x="76" y="100" fill="#56e0ce" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="5">WEBCAM LAB • 5 MINI APPS</text>
  <text x="72" y="174" fill="#f1f7ff" font-family="Arial,sans-serif" font-size="56" font-weight="700">Computer Vision</text>
  <text x="72" y="232" fill="#f1f7ff" font-family="Arial,sans-serif" font-size="56" font-weight="700">Playground</text>
  <text x="76" y="275" fill="#9bb0c8" font-family="Arial,sans-serif" font-size="22">Look closer. Track color. Play with your hands.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(72 328)"><rect width="330" height="140" rx="20" fill="#1c2c43" stroke="#33536b"/><circle cx="60" cy="65" r="33" fill="#183d4c"/><path d="M44 61c0-14 8-23 18-23s18 9 18 23v19H44z" fill="none" stroke="#56e0ce" stroke-width="4"/><circle cx="56" cy="60" r="2.5" fill="#56e0ce"/><circle cx="68" cy="60" r="2.5" fill="#56e0ce"/><text x="110" y="62" fill="#f3f7fc" font-size="21" font-weight="700">Face Detection</text><text x="110" y="92" fill="#9bb0c8" font-size="15">Find faces in real time</text></g>
    <g transform="translate(435 328)"><rect width="330" height="140" rx="20" fill="#1c2c43" stroke="#33536b"/><circle cx="60" cy="65" r="33" fill="#423c22"/><circle cx="60" cy="65" r="17" fill="#ffd45f" filter="url(#glow)"/><text x="110" y="62" fill="#f3f7fc" font-size="21" font-weight="700">Color Tracking</text><text x="110" y="92" fill="#9bb0c8" font-size="15">Follow a color with HSV</text></g>
    <g transform="translate(798 328)"><rect width="330" height="140" rx="20" fill="#1c2c43" stroke="#33536b"/><circle cx="60" cy="65" r="33" fill="#402c42"/><path d="M43 55q17-19 34 0v20q-17 17-34 0z" fill="none" stroke="#f49adb" stroke-width="4"/><circle cx="53" cy="63" r="2" fill="#f49adb"/><circle cx="67" cy="63" r="2" fill="#f49adb"/><path d="M54 76q6 6 12 0" fill="none" stroke="#f49adb" stroke-width="3"/><text x="110" y="62" fill="#f3f7fc" font-size="20" font-weight="700">Emotion Recognition</text><text x="110" y="92" fill="#9bb0c8" font-size="15">Estimate expressions</text></g>
    <g transform="translate(253 504)"><rect width="330" height="140" rx="20" fill="#1c2c43" stroke="#33536b"/><circle cx="60" cy="65" r="33" fill="#183e43"/><path d="M42 72l17-25 18 25-18 15zM59 47l13 16M77 72l13-17 14 17-13 12z" fill="none" stroke="#56e0ce" stroke-width="3"/><text x="110" y="62" fill="#f3f7fc" font-size="21" font-weight="700">Spatial Sketch</text><text x="110" y="92" fill="#9bb0c8" font-size="15">Draw planes and wire meshes</text></g>
    <g transform="translate(616 504)"><rect width="330" height="140" rx="20" fill="#1c2c43" stroke="#33536b"/><circle cx="60" cy="65" r="33" fill="#3f3025"/><path d="M48 83V60q0-6 5-6t5 6V44q0-6 5-6t5 6v16q0-6 5-6t5 6v8q0-6 5-5t5 8v11q0 10-10 10H58q-10 0-10-9" fill="none" stroke="#ffb66c" stroke-width="3.5" stroke-linecap="round"/><text x="110" y="62" fill="#f3f7fc" font-size="21" font-weight="700">Finger Calculator</text><text x="110" y="92" fill="#9bb0c8" font-size="15">Calculate with hand input</text></g>
  </g>
  <text x="76" y="684" fill="#7890a9" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">OPEN COMPUTER VISION PLAYGROUND • SELECT AN APP • START EXPLORING</text>
