[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "econometric-forecast-engine"
version = "1.0.0"
description = "Hybrid Python-R Econometric Forecasting & Time Series Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rpy2>=3.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "yfinance>=0.2.20",
    "pyyaml>=6.0.0",
    "httpx>=0.24.0",
    "rich>=13.0.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
